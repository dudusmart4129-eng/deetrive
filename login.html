<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Deetrive</title>

  <script type="module" crossorigin src="/deetrive/assets/login-DfheyE6z.js"></script>
  <link rel="modulepreload" crossorigin href="/deetrive/assets/modulepreload-polyfill-P2Xu9kJm.js">
  <link rel="modulepreload" crossorigin href="/deetrive/assets/dashboard-DL4OQPWp.js">
  <link rel="modulepreload" crossorigin href="/deetrive/assets/build-De_eEwsF.js">
  <link rel="modulepreload" crossorigin href="/deetrive/assets/wix-client-Ch-E7tYN.js">
  <link rel="stylesheet" crossorigin href="/deetrive/assets/style-B2Rbswhv.css">
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <h1>Welcome back</h1>

            <p class="login-intro">
                Log in to your Deetrive account.
            </p>

            <form>

                <label for="email">Email address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Log In
                </button>
              <button type="button" id="google-login">
    Login with Google
              </button>

            </form>

            <a href="#" class="forgot-password">
                Forgot your password?
            </a>

            <p class="signup-link">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

        </div>

    </main>
  
</body>



</html>
