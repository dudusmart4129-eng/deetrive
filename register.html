<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Deetrive</title>

  <script type="module" crossorigin src="/deetrive/assets/register-BPbxJTTh.js"></script>
  <link rel="modulepreload" crossorigin href="/deetrive/assets/wix-client-BcyrvGQV.js">
  <link rel="stylesheet" crossorigin href="/deetrive/assets/style-B2Rbswhv.css">
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <h1>Create your account</h1>

            <p class="login-intro">
                Join Deetrive and start your account setup.
            </p>

            <form>

                <label for="full-name">Full name</label>

                <input
                    type="text"
                    id="full-name"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

                <label for="confirm-password">Confirm password</label>

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm your password"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

            </form>

            <p class="signup-link">
                Already have an account?
                <a href="login.html">Log in</a>
            </p>

        </div>

    </main>

</body>

</html>
